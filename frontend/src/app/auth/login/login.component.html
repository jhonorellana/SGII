<div class="login-container">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="login-card shadow-lg">
    <!-- Brand Header -->
    <div class="login-header text-center">
      <div class="brand-badge mb-3">
        <i class="bi bi-graph-up-arrow"></i>
      </div>
      <h1 class="brand-title mb-1">SIPRO</h1>
      <p class="brand-subtitle text-muted mb-0">Sistema Integral de Portafolio y Rentabilidad Operativa</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form mt-4">
      
      <!-- Usuario Field -->
      <div class="form-group mb-3">
        <label for="nombre_usuario" class="form-label font-semibold text-secondary small">Usuario</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="bi bi-person-fill"></i>
          </span>
          <input
            id="nombre_usuario"
            type="text"
            formControlName="nombre_usuario"
            class="form-control border-start-0 ps-0"
            [class.is-invalid]="f['nombre_usuario'].invalid && f['nombre_usuario'].touched"
            placeholder="Ingrese su usuario"
            autocomplete="username"
          />
        </div>
        <div *ngIf="f['nombre_usuario'].invalid && f['nombre_usuario'].touched" class="invalid-feedback d-block mt-1">
          <span *ngIf="f['nombre_usuario'].errors?.['required']">El usuario es requerido</span>
        </div>
      </div>

      <!-- Contraseña Field -->
      <div class="form-group mb-4">
        <label for="clave" class="form-label font-semibold text-secondary small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="bi bi-shield-lock-fill"></i>
          </span>
          <input
            id="clave"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="clave"
            class="form-control border-start-0 border-end-0 ps-0"
            [class.is-invalid]="f['clave'].invalid && f['clave'].touched"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
          />
          <button 
            type="button" 
            class="btn btn-outline-secondary border-start-0 bg-light text-muted px-3"
            (click)="toggleShowPassword()" 
            title="Alternar visibilidad"
          >
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
          </button>
        </div>
        <div *ngIf="f['clave'].invalid && f['clave'].touched" class="invalid-feedback d-block mt-1">
          <span *ngIf="f['clave'].errors?.['required']">La contraseña es requerida</span>
        </div>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="btn btn-emerald w-100 py-2.5 font-bold shadow-sm"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="!isLoading" class="d-flex align-items-center justify-content-center gap-2">
          <span>Ingresar a la Plataforma</span>
          <i class="bi bi-arrow-right-short fs-5"></i>
        </span>
        <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          <span>Autenticando...</span>
        </span>
      </button>
    </form>

    <!-- Footer Note -->
    <div class="login-footer text-center border-top pt-3 mt-4">
      <small class="text-muted" style="font-size: 0.72rem;">
        <i class="bi bi-shield-check text-success me-1"></i> Acceso Restringido • Institucional SIPRO v7.0
      </small>
    </div>
  </div>
</div>
